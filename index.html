
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RMS Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'roboto-condensed': ['"Roboto Condensed"', 'sans-serif'],
              'roboto-mono': ['"Roboto Mono"', 'monospace'],
              'radeil': ['"Radeil"', 'sans-serif'],
            },
            screens: {
              'xl': '1280px',      // Small laptop
              '2xl': '1440px',     // Standard laptop
              '3xl': '1680px',     // Large laptop / small desktop
              '4xl': '1920px',     // Full HD desktop
              '5xl': '2560px',     // 2K-4K desktop
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Radeil';
        src: url('/fonts/Radeil.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #1C1C1C;
        color: #e4e4e7;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: auto; /* Allow scrolling if viewport < 1280px */
        overflow-y: hidden; /* App manages its own Y scroll */
        min-width: 1280px; /* Enforce desktop layout */
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>
